<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карта Oldlands</title>
<style>
:root {
  --bg: #121417; --panel: #1b1e23; --panel-2: #23272e; --line: #333943;
  --text: #e6e2d8; --muted: #9aa0a8; --accent: #e0b04a; --accent-ink: #1b1505;
  --blue: #6fb4e8; --green: #7fd67f; --red: #ef6461; --hl: 255, 204, 64;
  --map-bg: #0c0d0f; --shadow: 0 8px 24px rgba(0,0,0,.45);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3efe6; --panel: #fffdf8; --panel-2: #f1ebdf; --line: #ddd4c3;
    --text: #2a261f; --muted: #6f685b; --accent: #b07d12; --accent-ink: #fff;
    --blue: #2f6fa3; --green: #2f8a3a; --red: #c0392b; --map-bg: #d9d2c3;
    --shadow: 0 8px 24px rgba(60,40,10,.18);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 10px; cursor: pointer; white-space: nowrap;
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .45; cursor: default; }
button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
input {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 10px; min-width: 0;
}
input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

header {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 10;
}
.brand { font-weight: 700; letter-spacing: .02em; margin-right: 4px; }
.brand small { color: var(--muted); font-weight: 400; }
.field { position: relative; display: flex; align-items: center; }
.field.search { flex: 1 1 280px; }
.field.search input { width: 100%; padding-right: 72px; }
.field .tag { position: absolute; right: 30px; color: var(--muted); font-size: 12px; pointer-events: none; }
.field .x { position: absolute; right: 4px; border: 0; background: none; padding: 2px 6px; color: var(--muted); }
.field.cur input { width: 150px; padding-left: 28px; }
.field.cur::before { content: "📍"; position: absolute; left: 8px; font-size: 13px; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; }
.seg button:first-child { border-radius: 8px 0 0 8px; }
.seg button:last-child { border-radius: 0 8px 8px 0; margin-left: -1px; }

main { flex: 1; display: flex; min-height: 0; }
#stage { position: relative; flex: 1; min-width: 0; background: var(--map-bg); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#vp {
  position: absolute; inset: 0; overflow: auto; touch-action: none; cursor: grab;
  overscroll-behavior: contain;
}
#vp.drag { cursor: grabbing; }
#spacer { width: 1px; height: 1px; }

#zoomctl {
  position: absolute; right: 22px; bottom: 22px; display: flex; flex-direction: column; gap: 4px; z-index: 3;
}
#zoomctl button { width: 36px; height: 36px; padding: 0; font-size: 18px; box-shadow: var(--shadow); background: var(--panel); }
#layers {
  position: absolute; left: 12px; top: 12px; right: 12px; z-index: 3; display: flex; gap: 6px; flex-wrap: wrap;
  pointer-events: none;
}
#layers button {
  pointer-events: auto; font-size: 12.5px; padding: 5px 10px; border-radius: 999px;
  background: rgba(20,22,27,.82); color: #cfd3da; border-color: rgba(255,255,255,.14); backdrop-filter: blur(6px);
}
#layers button.on { background: rgba(224,176,74,.92); color: #1b1505; border-color: #e0b04a; }
@keyframes pop { 0% { transform: scale(1) rotate(0); } 40% { transform: scale(1.35) rotate(200deg); } 100% { transform: scale(1) rotate(360deg); } }
.seg button.pop { animation: pop .7s cubic-bezier(.3,1.4,.5,1); }
@media (max-width: 760px) { #layers { flex-wrap: nowrap; overflow-x: auto; pointer-events: auto; padding-bottom: 4px; } }
#zoomlvl { position: absolute; left: 12px; bottom: 22px; z-index: 3; font-size: 12px; color: #ddd;
  background: rgba(0,0,0,.55); padding: 3px 8px; border-radius: 6px; pointer-events: none; }

#tip {
  position: absolute; z-index: 4; pointer-events: none; display: none; max-width: 280px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  box-shadow: var(--shadow); font-size: 12.5px;
}
.menu {
  position: absolute; z-index: 5; display: none; min-width: 210px; padding: 4px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
}
.menu .hd { padding: 6px 10px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; border-radius: 6px; padding: 7px 10px; }
.menu button:hover { background: var(--panel-2); }

#toast {
  position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 6;
  background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; padding: 8px 14px;
  box-shadow: var(--shadow); display: none; max-width: calc(100% - 32px);
}

aside {
  width: 340px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
  overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px;
}
aside.hidden { display: none; }
.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.card h3 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card h3 button { text-transform: none; letter-spacing: 0; font-size: 12px; padding: 3px 8px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.row button { font-size: 12.5px; padding: 5px 9px; }
.coord { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--green); font-weight: 600; }
.loc { color: var(--text); font-weight: 600; }
.bots { color: var(--blue); }
.herb { color: var(--green); }
.boss { color: var(--red); font-weight: 600; }
.poi { color: var(--accent); }
.res { color: #4cc3e6; }
.muted { color: var(--muted); }
.lvl { font-variant-numeric: tabular-nums; color: var(--muted); }
ul.list { list-style: none; margin: 0; padding: 0; }
ul.list li { padding: 7px 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
ul.list li:hover { background: var(--panel); border-color: var(--line); }
ul.list li.sel { border-color: var(--accent); }
ul.list .meta { display: flex; justify-content: space-between; gap: 8px; }
.dist { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
.steps { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.7; word-break: break-word; }
.steps span { display: inline-block; padding: 0 5px; margin: 1px; border-radius: 5px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; }
.steps span:hover { border-color: var(--accent); }
details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; margin-top: 6px; }
kbd { font-family: inherit; font-size: 12px; background: var(--panel); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
.help p { margin: 4px 0; font-size: 13px; }
.help code { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 12.5px; }

@media (max-width: 760px) {
  header { padding: 8px 16px; }
  .brand { display: none; }
  .field.cur { flex: 1 1 140px; }
  .field.cur input { width: 100%; }
  aside {
    position: fixed; left: 0; right: 0; bottom: 0; width: auto; max-height: 50vh; z-index: 8;
    border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; box-shadow: var(--shadow);
    padding: 12px 16px;
  }
  #zoomctl { right: 16px; }
}
</style>

const TR = { а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"e",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"kh",ц:"ts",ч:"ch",ш:"sh",щ:"sch",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya" };
const norm = s => s.toLowerCase().replace(/ё/g, "е");
// " word word ": lets matching anchor at word starts ("огр" must not hit "Пограничная")
const toHay = s => " " + norm(s).replace(/[^a-zа-я0-9]+/g, " ").trim() + " ";
const translit = s => [...norm(s)].map(ch => TR[ch] ?? ch).join("");

};

// ---------- data ----------
const cells = new Map();
const R = DATA.regions;
// Overview map.jpg is the same artwork as the tiles, downscaled: one cell is
// 4.95 px and cell 980_990's top-left corner sits at (289, 179). Fitted by
// colour correlation of every tile against the overview (r ≈ 0.997).
const OV_K = 4.95, OV_U = 289, OV_V = 179;
const OVERVIEW = {
  path: "/image/map/map.jpg",
  xs: [[0, 980 - OV_U / OV_K], [900, 980 + (900 - OV_U) / OV_K]],
  ys: [[0, 990 - OV_V / OV_K], [564, 990 + (564 - OV_V) / OV_K]],
};
// Sharper whole-world overview stitched from nlservice.cc tiles (see img/map_full.json):
// top-left is cell 922_954, 180x114 cells. map.jpg is shown until it has loaded.
const FULL = { src: "img/map_full.jpg", x0: 922, y0: 954, w: 180, h: 114 };
const minX = Math.floor(Math.min(...R.map(r => r.x0), OVERVIEW.xs[0][1], FULL.x0)), maxX = Math.ceil(Math.max(...R.map(r => r.x1), OVERVIEW.xs.at(-1)[1] - 1, FULL.x0 + FULL.w - 1));
const minY = Math.floor(Math.min(...R.map(r => r.y0), OVERVIEW.ys[0][1], FULL.y0)), maxY = Math.ceil(Math.max(...R.map(r => r.y1), OVERVIEW.ys.at(-1)[1] - 1, FULL.y0 + FULL.h - 1));
const GW = maxX - minX + 1, GH = maxY - minY + 1;
const key = (x, y) => x + "_" + y;

for (const c of DATA.cells) {
  c.key = key(c.x, c.y);
  c.ents = [];
  const add = (kind, ru, lo, hi, extra = "") => {
    const al = BOT_EN[ru] ?? [PLACE_EN[ru] ?? ""];
    const hay = toHay([ru, translit(ru), ...al, extra].join(" "));
    c.ents.push({ kind, ru, lo, hi, hay });
  };
  (c.loc || []).forEach(l => add("loc", l, null, null, /телепорт|врата/i.test(l) ? "portal tp портал" : ""));
  (c.bots || []).forEach(([n, lo, hi]) => add("bot", n, lo, hi));
  if (c.boss) add("boss", c.boss.name, c.boss.lvl, c.boss.lvl, KIND_ALIASES.boss);
  if (c.herbs != null) add("herb", "Травы", c.herbs, c.herbs, KIND_ALIASES.herb);
  (c.res || []).forEach(r => add("res", r, null, null, KIND_ALIASES[r] || ""));
  (c.poi || []).forEach(p => add("poi", p, null, null, KIND_ALIASES.poi));
  if (c.label) c.ents.push({ kind: "id", ru: c.label, hay: toHay(c.label) });
  cells.set(c.key, c);
}
// The API omits some seams between regions (e.g. column x=1011 between 8 and 9)
// even though the tiles exist. Infer a one-cell bridge where walkable cells sit
// on both sides of such an uncovered gap.
const inRegion = (x, y) => R.some(r => x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y1);
const bridges = [];
{
  const walk = (x, y) => cells.has(key(x, y)) && !cells.get(key(x, y)).bridge;
  for (let y = minY; y <= maxY; y++) for (let x = minX; x <= maxX; x++) {
    if (inRegion(x, y)) continue;
    const across = (walk(x - 1, y) || walk(x - 1, y - 1) || walk(x - 1, y + 1)) && (walk(x + 1, y) || walk(x + 1, y - 1) || walk(x + 1, y + 1))
      && (inRegion(x - 1, y) && inRegion(x + 1, y));
    const down = (walk(x, y - 1) || walk(x - 1, y - 1) || walk(x + 1, y - 1)) && (walk(x, y + 1) || walk(x - 1, y + 1) || walk(x + 1, y + 1))
      && (inRegion(x, y - 1) && inRegion(x, y + 1));
    if (across || down) bridges.push({ x, y, key: key(x, y), bridge: true, ents: [] });
  }
  bridges.forEach(b => cells.set(b.key, b));
}
for (const c of cells.values()) {
  c.nb = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const n = cells.get(key(c.x + dx, c.y + dy));
    if (n) c.nb.push(n);
  }
}

  tipEl.style.display = "block";
  const st = $("#stage").getBoundingClientRect();
  tipEl.style.left = Math.min(mx + 16, st.width - tipEl.offsetWidth - 8) + "px";
  tipEl.style.top = Math.min(my + 16, st.height - tipEl.offsetHeight - 8) + "px";
}
const hideTip = () => { tipEl.style.display = "none"; };

// pointer: drag to pan, click to select, pinch to zoom, long-press for menu
const ptrs = new Map();
let drag = null, pinch = null, longT = 0;
const rel = e => { const r = vp.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
vp.addEventListener("pointerdown", e => {
  if (e.button === 2) return;
  // let native scrollbar dragging work
  const [px, py] = rel(e);
  if (px >= vp.clientWidth || py >= vp.clientHeight) return;
  closeMenu();
  vp.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, rel(e));
  if (ptrs.size === 1) {
    const [mx, my] = rel(e);
    drag = { x: mx, y: my, sx: S.sx, sy: S.sy, moved: false };
    if (e.pointerType !== "mouse") longT = setTimeout(() => { if (drag && !drag.moved) { drag = null; openMenu(cellAt(mx, my), mx, my); } }, 550);
  } else if (ptrs.size === 2) {
    clearTimeout(longT); drag = null;
    const [a, b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: S.zoom };
  }
});
vp.addEventListener("pointermove", e => {
  const [mx, my] = rel(e);
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, [mx, my]);
  if (pinch && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    setZoom(pinch.z * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
    return;
  }
  if (drag) {
    if (!drag.moved && Math.hypot(mx - drag.x, my - drag.y) > 4) { drag.moved = true; vp.classList.add("drag"); hideTip(); clearTimeout(longT); }
    if (drag.moved) { setScroll(drag.sx - (mx - drag.x), drag.sy - (my - drag.y)); return; }
  }
  if (e.pointerType === "mouse") {
    const k = cellAt(mx, my), h = cells.has(k) ? k : null;
    if (h !== S.hover) { S.hover = h; requestDraw(); }
    h ? showTip(h, mx, my) : hideTip();
  }
});
const endPtr = e => {
  ptrs.delete(e.pointerId); clearTimeout(longT);
  if (ptrs.size < 2) pinch = null;
  if (drag && e.type === "pointerup" && !drag.moved && e.button === 0) {
    const [mx, my] = rel(e); select(cellAt(mx, my));
  }
  if (ptrs.size === 0) { drag = null; vp.classList.remove("drag"); }
};
vp.addEventListener("pointerup", endPtr);
vp.addEventListener("pointercancel", endPtr);
vp.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") { S.hover = null; hideTip(); requestDraw(); } });
vp.addEventListener("contextmenu", e => { e.preventDefault(); const [mx, my] = rel(e); openMenu(cellAt(mx, my), mx, my); });
vp.addEventListener("wheel", e => {
  e.preventDefault(); closeMenu();
  const [mx, my] = rel(e);
  const dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
  const k = e.ctrlKey ? 0.01 : 0.0022; // ctrlKey = trackpad pinch
  zoomTo((zTarget ?? S.zoom) * Math.exp(-dy * k), mx, my);
}, { passive: false });
document.addEventListener("pointerdown", e => { if (!ctxEl.contains(e.target)) closeMenu(); });

$("#zIn").onclick = () => zoomTo((zTarget ?? S.zoom) * 1.5, vp.clientWidth / 2, vp.clientHeight / 2);
$("#zOut").onclick = () => zoomTo((zTarget ?? S.zoom) / 1.5, vp.clientWidth / 2, vp.clientHeight / 2);
$("#zFit").onclick = fitAll;
$("#zCur").onclick = () => S.cur ? centerKey(S.cur) : toast(t("setCurFirst"));
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeMenu(); if (document.activeElement.tagName === "INPUT") document.activeElement.blur(); }
  if (document.activeElement.tagName === "INPUT") return;
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
  if (e.key === "+" || e.key === "=") $("#zIn").click();
  if (e.key === "-" || e.key === "_") $("#zOut").click();
  const pan = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (pan) { e.preventDefault(); setScroll(S.sx + pan[0] * 160, S.sy + pan[1] * 160); }
});

// search box
let qT = 0;
$("#q").addEventListener("input", e => { S.query = e.target.value; clearTimeout(qT); qT = setTimeout(runSearch, 120); });
$("#q").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  clearTimeout(qT); runSearch();
  if (S.matchList.length) {
    const k = S.matchList[0].c.key;
    if (S.matchList.length === 1) select(k, true); else fitKeys(S.matchList.map(m => m.c.key));
  }
});
$("#qclear").onclick = () => { $("#q").value = S.query = ""; runSearch(); $("#q").focus(); };
// current cell
$("#cur").addEventListener("change", e => {
  const v = e.target.value.trim();
  if (!v) return setCur(null);
  const k = parseCoord(v);
  if (!k) return toast(t("badCoord"));
  setCur(k);
  if (cells.has(k)) centerKey(k);
});
$("#cur").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
$("#btnClosest").onclick = () => routeClosest(S.cur);
$("#btnPanel").onclick = () => store.set("panelHidden", $("#side").classList.toggle("hidden"));

function setMode(m) {
  S.mode = m; store.set("mode", m);
  $("#mDay").classList.toggle("on", m === "day"); $("#mNight").classList.toggle("on", m === "night");
  requestDraw();
}
// Day/night switch: snapshot the current frame, flip the tile set, wait briefly
// for the new tiles on screen, then reveal them with an expanding ring from the
// button that was clicked — warm sunrise glow for day, starfield for night.
let trans = null, TRANS_MS = 1600;
function switchMode(m, btn) {
  btn.classList.remove("pop"); void btn.offsetWidth; btn.classList.add("pop");
  if (m === S.mode) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return setMode(m);
  const snap = document.createElement("canvas");
  snap.width = cv.width; snap.height = cv.height;
  snap.getContext("2d").drawImage(cv, 0, 0);
  const b = btn.getBoundingClientRect(), st = cv.getBoundingClientRect();
  const ox = b.left + b.width / 2 - st.left, oy = b.top + b.height / 2 - st.top;
  const W = st.width, H = st.height;
  const maxR = Math.max(...[[0, 0], [W, 0], [0, H], [W, H]].map(([x, y]) => Math.hypot(x - ox, y - oy)));
  const sparks = Array.from({ length: 140 }, () => ({
    x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + .4, ph: Math.random() * 6.28,
  }));
  trans = { snap, to: m, t0: performance.now(), wipeAt: null, ox, oy, maxR, sparks };
  setMode(m);
}
function drawTransition(W, H, dpr) {
  const T = trans, now = performance.now();
  if (T.wipeAt == null && (tilesReady >= .97 || now - T.t0 > 2500)) T.wipeAt = now;
  const p = T.wipeAt == null ? 0 : Math.min(1, (now - T.wipeAt) / TRANS_MS);
  const e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const R = e * (T.maxR + 120);
  const night = T.to === "night";
  ctx.save();
  // old frame stays outside the ring
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.beginPath(); ctx.rect(0, 0, cv.width, cv.height); ctx.arc(T.ox * dpr, T.oy * dpr, Math.max(0, R) * dpr, 0, Math.PI * 2, true);
  ctx.clip("evenodd");
  ctx.drawImage(T.snap, 0, 0);
  ctx.restore();
  if (R > 0) {
    ctx.save();
    // tint washing out behind the front
    ctx.beginPath(); ctx.arc(T.ox, T.oy, R, 0, Math.PI * 2);
    ctx.fillStyle = night ? `rgba(20,30,90,${.5 * (1 - e)})` : `rgba(255,214,140,${.4 * (1 - e)})`;
    ctx.fill();
    // glowing front
    const g = ctx.createRadialGradient(T.ox, T.oy, Math.max(0, R - 140), T.ox, T.oy, R + 4);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(.7, night ? "rgba(70,90,255,.18)" : "rgba(255,170,60,.2)");
    g.addColorStop(.96, night ? "rgba(180,205,255,.85)" : "rgba(255,244,190,.95)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(T.ox, T.oy, R + 4, 0, Math.PI * 2); ctx.fill();
    // stars (night) / sun motes (day) twinkle inside the revealed area, then fade
    for (const sp of T.sparks) {
      const d = Math.hypot(sp.x - T.ox, sp.y - T.oy);
      if (d > R) continue;
      const a = (1 - p) * (.55 + .45 * Math.sin(now / 120 + sp.ph)) * Math.min(1, (R - d) / 60);
      ctx.fillStyle = night ? `rgba(220,235,255,${a})` : `rgba(255,236,170,${a})`;
      ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r * (night ? 1 : 1.6), 0, Math.PI * 2); ctx.fill();
      if (night && sp.r > 1.6) { ctx.fillRect(sp.x - sp.r * 3, sp.y - .4, sp.r * 6, .8); ctx.fillRect(sp.x - .4, sp.y - sp.r * 3, .8, sp.r * 6); }
    }
    ctx.restore();
  }
  if (p >= 1) trans = null;
  requestDraw();
}
$("#mDay").onclick = e => switchMode("day", e.currentTarget);
$("#mNight").onclick = e => switchMode("night", e.currentTarget);

// layer switches
const LAYERS = ["town", "transport", "links", "castle", "place", "shop", "boss", "route"];
function renderLayers() {
  $("#layers").innerHTML = LAYERS.map(l =>
    `<button data-l="${l}" class="${S.layers[l] ? "on" : ""}" title="${esc(t("L_" + l + "_tip"))}">${t("L_" + l)}</button>`).join("");
}
$("#layers").addEventListener("click", e => {
  const b = e.target.closest("button[data-l]"); if (!b) return;
  const l = b.dataset.l;
  S.layers[l] = !S.layers[l]; store.set("layers", S.layers);
  b.classList.toggle("on", S.layers[l]);
  if (l === "route") {
    if (S.cur && cells.has(S.cur)) S.dist = distTiered(S.cur);
    if (S.from && S.to) routeTo(S.from, S.to);
    sortMatches(); renderSide();
  }
  requestDraw();
});
function setLang(l) {
  S.lang = l; store.set("lang", l);
  document.documentElement.lang = l;
  document.title = t("title");
  $("#lRu").classList.toggle("on", l === "ru"); $("#lEn").classList.toggle("on", l === "en");
  document.querySelectorAll("[data-i]").forEach(el => { if (UI.ru[el.dataset.i]) el.textContent = t(el.dataset.i); });
  $("#q").placeholder = t("search");
  $("#mDay").title = t("day"); $("#mNight").title = t("night");
  renderLayers(); renderSide(); requestDraw();
}
$("#lRu").onclick = () => setLang("ru");
$("#lEn").onclick = () => setLang("en");

// ---------- boot ----------
let viewRestored = false; // don't overwrite the saved view with the initial layout
if (store.get("panelHidden", window.matchMedia("(max-width: 760px)").matches)) $("#side").classList.add("hidden");
setMode(S.mode);
setLang(S.lang);
$("#q").value = S.query;
resize();
setCur(S.cur, true);
runSearch();
{
  const sel = store.get("sel", null), route = store.get("route", null);
  if (sel && cells.has(sel)) S.sel = sel;
  if (route?.from && route?.to) routeTo(route.from, route.to, false);
  else if (route?.from) { S.from = route.from; renderSide(); }
}
requestAnimationFrame(() => {
  const v = store.get("view", null);
  if (v && isFinite(v.z) && isFinite(v.cx) && isFinite(v.cy)) {
    cancelAnimationFrame(panAnim);
    setZoom(v.z);
    setScroll((v.cx - minX) * cs() + offX() - vp.clientWidth / 2, (v.cy - minY) * cs() + offY() - vp.clientHeight / 2);
  } else if (S.cur && cells.has(S.cur)) centerKey(S.cur, 0.6);
  else fitBox(980, 988, 1042, 1042);
  viewRestored = true;
});
</script>
</body>
